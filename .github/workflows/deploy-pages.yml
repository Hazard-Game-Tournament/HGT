name: Déployer le site HGT (Angular) sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgt-angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Copier les styles et images de l'ancienne version
        run: |
          mkdir -p legacy/css legacy/assets public
          cp -r ../css/. legacy/css/
          cp -r ../assets/. legacy/assets/
          [ -f legacy/css/styles.css ] || touch legacy/css/styles.css

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Compiler Angular
        run: npx ng build --configuration production --base-href ./

      - name: Préparer le site
        run: |
          OUT=dist/hgt-angular/browser
          cp $OUT/index.html $OUT/404.html
          touch $OUT/.nojekyll
          ls -la $OUT

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hgt-angular/dist/hgt-angular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
