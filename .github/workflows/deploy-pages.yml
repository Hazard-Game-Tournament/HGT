name: Déployer le site HGT sur GitHub Pages

# Publie automatiquement le site HGT (version classique : index.html + js/app.js + css + assets)
# à chaque push sur main. La migration Angular reste en cours sur refactor/angular
# et ne sera publiée que lorsqu'elle affichera réellement le jeu.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer le site classique
        run: |
          set -e
          mkdir -p _site
          cp -r assets css js _site/
          cp manifest.webmanifest sw.js _site/
          [ -f CNAME ] && cp CNAME _site/ || true

          # index.html actuel = build Angular cassé (écran noir) ?
          # Si oui, on reprend la dernière version classique de l'historique.
          if grep -q '<app-root' index.html; then
            echo "index.html actuel = build Angular, recherche de la dernière version classique..."
            FOUND=""
            for c in $(git log --format=%H -- index.html); do
              if git show "$c:index.html" > /tmp/idx.html 2>/dev/null && ! grep -q '<app-root' /tmp/idx.html && grep -q 'js/app.js' /tmp/idx.html; then
                FOUND=$c; break
              fi
            done
            [ -n "$FOUND" ] || { echo "Aucun index.html classique trouvé"; exit 1; }
            echo "index.html restauré depuis $FOUND"
            cp /tmp/idx.html _site/index.html
          else
            cp index.html _site/index.html
          fi
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
