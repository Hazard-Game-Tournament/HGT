name: Déployer Angular sur GitHub Pages

# Déclenchement MANUEL uniquement : rien n'est publié tant que tu ne lances pas
# ce workflow (Actions > Déployer Angular sur GitHub Pages > Run workflow)
# ET que Settings > Pages > Source = "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer CSS, assets et manifest depuis main
        run: |
          git fetch origin main
          mkdir -p hgt-angular/legacy hgt-angular/public
          git --work-tree=hgt-angular/legacy checkout origin/main -- css assets
          git show origin/main:manifest.webmanifest > hgt-angular/public/manifest.webmanifest
          git show origin/main:CNAME > hgt-angular/public/CNAME 2>/dev/null || rm -f hgt-angular/public/CNAME
          git reset -q

      - name: Nettoyer le CSS legacy pour Angular
        working-directory: hgt-angular/legacy/css
        run: |
          sed -i -E "s#url\((['\"]?)(\.\./|\./)?assets/#url(\1/assets/#g" styles.css
          sed -i -E 's#</?style[^>]*>##g' styles.css
          sed -i -E 's#;[[:space:]]*drop-shadow\(# drop-shadow(#g' styles.css

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hgt-angular/package-lock.json

      - name: Installer les dépendances
        working-directory: hgt-angular
        run: npm ci

      - name: Calculer le base-href
        id: base
        run: |
          if [ -f hgt-angular/public/CNAME ]; then echo "href=/" >> "$GITHUB_OUTPUT"; else echo "href=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"; fi

      - name: Build
        working-directory: hgt-angular
        run: npx ng build --base-href=${{ steps.base.outputs.href }}

      - name: Préparer le site (SPA 404 + .nojekyll)
        run: |
          OUT=$(dirname $(find hgt-angular/dist -name index.html -path '*browser*' | head -n1))
          echo "Dossier de sortie : $OUT"
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
