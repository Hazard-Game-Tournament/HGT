name: Déployer le site HGT (Angular) sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgt-angular
    steps:
      - uses: actions/checkout@v4

      - name: Règle du projet - aucun fichier JavaScript dans hgt-angular/src
        run: |
          FILES=$(find src -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.jsx' \) || true)
          if [ -n "$FILES" ]; then
            echo "::error::Fichiers JavaScript interdits (TypeScript uniquement) :"
            echo "$FILES"
            exit 1
          fi
          echo "OK : aucun fichier JavaScript dans src/"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Préparer les ressources legacy pour Angular
        run: |
          mkdir -p legacy/css legacy/assets legacy-js public
          cp -r ../css/. legacy/css/
          cp -r ../assets/. legacy/assets/
          cp -r ../js/. legacy-js/
          cp ../manifest.webmanifest public/manifest.webmanifest
          [ -f legacy/css/styles.css ] || touch legacy/css/styles.css

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Compiler Angular
        run: npx ng build --configuration production --base-href ./

      - name: Ajouter la page legacy de création de personnage au site compilé
        run: |
          OUT=dist/hgt-angular/browser
          mkdir -p "$OUT/legacy"
          cp ../index.html "$OUT/legacy/index.html"
          sed -i 's#<head>#<head><base href="../">#' "$OUT/legacy/index.html"

      - name: Préparer le site
        run: |
          OUT=dist/hgt-angular/browser
          cp $OUT/index.html $OUT/404.html
          touch $OUT/.nojekyll
          ls -la $OUT

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hgt-angular/dist/hgt-angular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
